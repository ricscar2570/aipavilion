name: Continuous integration

on:
  push:
    branches: [diagnostic/prettier-20261009]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prettier-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: |
          node scripts/check-lockfile-portability.js
          npm run ci:install

      - name: Print exact Prettier patch
        run: |
          npx prettier --write docs/operations/INTERNAL-PILOT-RUNBOOK.md scripts/check-internal-pilot.js scripts/internal-pilot/export-test-context.js tests/unit/phase4-endpoints.test.js
          git --no-pager diff -- docs/operations/INTERNAL-PILOT-RUNBOOK.md scripts/check-internal-pilot.js scripts/internal-pilot/export-test-context.js tests/unit/phase4-endpoints.test.js
          exit 1
