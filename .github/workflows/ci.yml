name: Continuous integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: |
          node scripts/check-lockfile-portability.js
          npm run ci:install

      - name: Verify source, contracts, tests, and frontend build
        run: npm run verify

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          if-no-files-found: error

  sam:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Install dependencies
        run: |
          node scripts/check-lockfile-portability.js
          npm run ci:install

      - name: Generate and verify retained pilot template
        run: |
          npm run pilot:generate
          npm run pilot:check

      - name: Validate development and pilot SAM templates
        run: |
          sam validate --lint --template-file template.yaml
          sam validate --lint --template-file infrastructure/backend-pilot.yaml

      - name: Build development and pilot Lambda artifacts
        run: |
          sam build --template-file template.yaml --build-dir .aws-sam-dev
          sam build --template-file infrastructure/backend-pilot.yaml --build-dir .aws-sam-pilot
