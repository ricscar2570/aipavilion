name: Coverage diagnostic

on:
  push:
    branches: [diagnostic/prettier-20261009]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Install dependencies
        run: |
          node scripts/check-lockfile-portability.js
          npm run ci:install
      - name: Print coverage counts
        run: |
          npx jest --coverage --runInBand --silent --coverageReporters=json-summary || true
          node -e 'const s=require("./coverage/coverage-summary.json"); console.log(JSON.stringify(s,null,2))'
          exit 1
