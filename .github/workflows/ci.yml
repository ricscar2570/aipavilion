name: Prettier diagnostic phase3

on:
  push:
    branches: [diagnostic/prettier-phase3-20261009]

permissions:
  contents: read

jobs:
  prettier-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - run: |
          node scripts/check-lockfile-portability.js
          npm run ci:install
      - run: |
          npx prettier --write tests/unit/phase3-endpoints.test.js
          git --no-pager diff -- tests/unit/phase3-endpoints.test.js
          exit 1
